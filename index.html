<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Приглашение на свидание для Николь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #f6f2f4;
      --card-bg: rgba(255, 255, 255, 0.9);
      --accent-pink: #f7a8b8;
      --accent-dark-pink: #d9657e;
      --text-main: #3a2e30;
      --text-muted: #827376;
      --env-front: #ffffff;
      --env-inner: #ece4ec;
      --env-flap: #f7f3f9;
      --env-pocket: #ede8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Фоновые изогнутые полосы */
    .bg-wave {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 14vw;
      max-width: 130px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }
    .bg-wave-left { left: 0; }
    .bg-wave-right { right: 0; transform: scaleX(-1); }

    .screen {
      display: none;
      width: 100%;
      min-height: 100vh;
      padding: 30px 16px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .screen.active {
      display: flex;
      opacity: 1;
    }

    /* ================= СТРАНИЦА 1: 3D КОНВЕРТ ================= */
    #screen-intro {
      text-align: center;
      perspective: 1200px;
      overflow: hidden;
    }

    .intro-header {
      font-family: 'Caveat', cursive;
      font-size: 2.5rem;
      color: var(--accent-dark-pink);
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(217, 101, 126, 0.15);
      transition: opacity 0.4s ease;
    }

    .intro-arrow {
      font-size: 1.9rem;
      color: var(--accent-pink);
      animation: bounce 1.4s infinite;
      margin-bottom: 30px;
      transition: opacity 0.4s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(9px); }
    }

    /* 3D Сцена конверта */
    .scene-3d {
      width: 300px;
      height: 200px;
      position: relative;
      perspective: 1200px;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .envelope-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: gentleWiggle 4s ease-in-out infinite;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes gentleWiggle {
      0%, 100% { transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg); }
      25% { transform: rotateY(-6deg) rotateX(3deg) rotateZ(-1.5deg); }
      75% { transform: rotateY(6deg) rotateX(-3deg) rotateZ(1.5deg); }
    }

    /* Тело конверта (задняя стенка) */
    .env-back {
      position: absolute;
      inset: 0;
      background: var(--env-inner);
      border-radius: 14px;
      box-shadow: 0 22px 50px rgba(180, 140, 160, 0.35), 0 4px 15px rgba(0,0,0,0.06);
      border: 1px solid rgba(255, 255, 255, 0.9);
      overflow: hidden;
    }

    /* Внутренняя тень глубины */
    .env-inner-shadow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0,0,0,0.02), rgba(80, 50, 70, 0.18));
      z-index: 1;
    }

    /* Верхний клапан (крышка) */
    .env-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 115px solid var(--env-flap);
      transform-origin: top center;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 5;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.08));
    }

    /* Боковые и нижний карманы (передняя часть) */
    .env-front-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 150px solid var(--env-pocket);
      border-right: 150px solid var(--env-pocket);
      border-bottom: 105px solid var(--env-front);
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      z-index: 4;
      filter: drop-shadow(0 -3px 8px rgba(0,0,0,0.04));
    }

    /* Сердечко-печать */
    .env-seal {
      position: absolute;
      top: 96px;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 7;
      font-size: 2.2rem;
      filter: drop-shadow(0 6px 10px rgba(217, 101, 126, 0.4));
      transition: transform 0.4s ease, opacity 0.3s ease;
      user-select: none;
    }

    .nikol-tag {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      color: var(--accent-dark-pink);
      font-weight: 700;
      z-index: 8;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    /* 3D-анимация: открытие клапана и залет камеры внутрь */
    .scene-3d.opening .envelope-3d {
      animation: none;
      transform: rotateX(20deg) scale(1.05);
    }
    .scene-3d.opening .env-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }
    .scene-3d.opening .env-seal {
      transform: translate(-50%, -80px) scale(0);
      opacity: 0;
    }

    .scene-3d.zoom-dive .envelope-3d {
      /* Эффект полета внутрь полости конверта */
      transform: translateZ(950px) translateY(80px) rotateX(55deg) scale(6) !important;
      opacity: 0;
      transition: transform 1.2s cubic-bezier(0.7, 0, 0.85, 0.1), opacity 0.9s ease 0.3s;
    }

    /* ================= СТРАНИЦА 2: СЕТКА ВЫБОРА ================= */
    .screen-title {
      font-size: 2.3rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 25px;
      color: var(--accent-dark-pink);
      font-family: 'Caveat', cursive;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 30px;
    }

    .grid-item {
      background: var(--card-bg);
      border: 1.5px solid rgba(247, 168, 184, 0.35);
      border-radius: 18px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px 6px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.03);
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .grid-item:hover, .grid-item:active {
      transform: translateY(-4px) scale(1.03);
      border-color: var(--accent-pink);
      box-shadow: 0 12px 24px rgba(247, 168, 184, 0.3);
    }

    .grid-item .icon {
      font-size: 1.9rem;
      margin-bottom: 6px;
    }

    .grid-item .title {
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .grid-item.full-width {
      grid-column: 1 / -1;
      aspect-ratio: auto;
      padding: 16px;
      flex-direction: row;
      gap: 12px;
    }

    /* МОДАЛЬНОЕ ОКНО ДЕТАЛЕЙ КАРТОЧКИ */
    .focus-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(246, 242, 244, 0.92);
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2);
    }

    .focus-modal.active {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .focus-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 22px 45px rgba(217, 101, 126, 0.18);
      border: 1px solid rgba(247, 168, 184, 0.4);
    }

    .focus-title {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--accent-dark-pink);
    }

    .focus-desc {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      margin-bottom: 26px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 30px;
      border: none;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 10px;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f7a8b8, #e07a93);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(224, 122, 147, 0.35);
    }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      background: #f3ecf0;
      color: var(--text-muted);
    }

    /* ================= СТРАНИЦА 3: ВЫБОР EAT ================= */
    .eat-section {
      width: 100%;
      max-width: 440px;
      margin-bottom: 20px;
    }

    .custom-input-box {
      background: #fff;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(247, 168, 184, 0.4);
      margin-bottom: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.03);
    }

    .custom-input-box input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px dashed var(--accent-pink);
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fffafa;
    }

    .category-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin: 16px 0 10px 6px;
      color: var(--accent-dark-pink);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .food-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      box-shadow: 0 6px 14px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }

    .food-card img {
      width: 100%;
      height: 90px;
      object-fit: cover;
      display: block;
    }

    .food-card .food-name {
      padding: 8px 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .food-card.selected {
      border-color: var(--accent-dark-pink);
      background-color: #fff6f8;
      box-shadow: 0 8px 20px rgba(217, 101, 126, 0.25);
    }

    /* ================= СТРАНИЦА 4: ФИНАЛ ================= */
    #screen-final {
      text-align: center;
    }

    .final-badge {
      font-family: 'Caveat', cursive;
      font-size: 3rem;
      color: var(--accent-dark-pink);
      line-height: 1.2;
      margin-bottom: 18px;
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .final-sub {
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--text-main);
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <!-- Боковые волнистые линии SVG -->
  <svg class="bg-wave bg-wave-left" viewBox="0 0 100 800" fill="none">
    <path d="M20 0 C 70 200, -20 400, 60 600 C 100 700, 10 800, 40 850" stroke="#f7a8b8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60 0 C 10 180, 80 420, 10 620 C -20 720, 70 800, 30 850" stroke="#fce4ec" stroke-width="2" stroke-linecap="round" fill="none"/>
  </svg>
  <svg class="bg-wave bg-wave-right" viewBox="0 0 100 800" fill="none">
    <path d="M20 0 C 70 200, -20 400, 60 600 C 100 700, 10 800, 40 850" stroke="#f7a8b8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </svg>

  <!-- СТРАНИЦА 1: 3D КОНВЕРТ -->
  <div id="screen-intro" class="screen active">
    <h1 class="intro-header" id="intro-title">приглашение на свидание</h1>
    <div class="intro-arrow" id="intro-arrow">↓</div>

    <div class="scene-3d" id="envelope-scene">
      <div class="envelope-3d" id="envelope-body">
        <div class="env-back">
          <div class="env-inner-shadow"></div>
        </div>
        <div class="env-flap"></div>
        <div class="env-seal">💖</div>
        <div class="env-front-pocket"></div>
        <div class="nikol-tag">For Nikol</div>
      </div>
    </div>
  </div>

  <!-- СТРАНИЦА 2: СЕТКА ВЫБОРА -->
  <div id="screen-grid" class="screen">
    <h2 class="screen-title">Выбери наше свидание ✨</h2>
    <div class="grid-container" id="activities-grid"></div>
  </div>

  <!-- МОДАЛКА ВЫБОРА -->
  <div class="focus-modal" id="focus-modal">
    <div class="focus-card">
      <h3 class="focus-title" id="modal-title"></h3>
      <p class="focus-desc" id="modal-desc"></p>
      <div id="modal-actions"></div>
    </div>
  </div>

  <!-- СТРАНИЦА 3: ВЫБОР ЕДЫ -->
  <div id="screen-eat" class="screen">
    <h2 class="screen-title">Где перекусим? ✨</h2>

    <div class="eat-section">
      <div class="custom-input-box">
        <label style="font-size: 0.85rem; font-weight: 500; color: var(--accent-dark-pink); display: block; margin-bottom: 6px;">Свой вариант:</label>
        <input type="text" id="custom-food" placeholder="Напиши заведение или блюдо..." />
      </div>

      <div class="category-title">Basic</div>
      <div class="food-grid">
        <div class="food-card" onclick="selectFood(this, 'McDonald’s')">
          <img src="https://images.unsplash.com/photo-1552895638-f7fe08d20265?w=400&q=75" alt="McDonald’s">
          <div class="food-name">McDonald’s</div>
        </div>
        <div class="food-card" onclick="selectFood(this, 'ChinChin')">
          <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400&q=75" alt="ChinChin">
          <div class="food-name">ChinChin</div>
        </div>
        <div class="food-card" onclick="selectFood(this, 'Японський привіт')">
          <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=400&q=75" alt="Японський привіт">
          <div class="food-name">Японський привіт</div>
        </div>
        <div class="food-card" onclick="selectFood(this, 'Селям')">
          <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=400&q=75" alt="Селям">
          <div class="food-name">Селям</div>
        </div>
      </div>

      <div class="category-title" style="margin-top: 24px;">Че это</div>
      <div class="food-grid">
        <div class="food-card" onclick="selectFood(this, 'Баранчик')">
          <img src="https://images.unsplash.com/photo-1541544741938-0af808871cc0?w=400&q=75" alt="Баранчик">
          <div class="food-name">Баранчик</div>
        </div>
        <div class="food-card" onclick="selectFood(this, 'Thegentelman')">
          <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400&q=75" alt="Thegentelman">
          <div class="food-name">Thegentelman</div>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" style="max-width: 440px;" onclick="confirmDate()">Подтвердить всё ❤️</button>
  </div>

  <!-- СТРАНИЦА 4: ФИНАЛ -->
  <div id="screen-final" class="screen">
    <div class="final-badge">Приглашение на свидание принято!!!</div>
    <div class="final-sub">Люблю тебя! Моя Николь ❤️</div>
  </div>

  <script>
    /* ========== ДАННЫЕ ДЛЯ TELEGRAM ========== */
    const TELEGRAM_BOT_TOKEN = 'YOUR_TELEGRAM_BOT_TOKEN'; // Вставь токен своего бота
    const TELEGRAM_CHAT_ID = 'YOUR_TELEGRAM_CHAT_ID';     // Вставь свой ID чата (число)

    const activities = [
      { id: 1, title: 'Пирогов', icon: '🏛️', desc: 'Ты говорила что не была в этом прекрасном месте, так что?', hasEat: false },
      { id: 2, title: 'Stand up', icon: '🎙️', desc: 'Выбор стендапа остается за тобой', hasEat: false },
      { id: 3, title: 'Вечір джазу', icon: '🎷', desc: 'Я считаю это одним из лучших выборов, красивый джазовый вечер, вкусные закуски, звон бокалов с игристым и ты - неотразимая, в том самом платье', hasEat: false },
      { id: 4, title: 'Скалолазанье', icon: '🧗‍♀️', desc: 'Я знаю что ты боишься высоты, но почему бы не попробовать?', hasEat: false },
      { id: 5, title: 'Стрельба из лука', icon: '🏹', desc: 'Можешь почувствовать себя Арьей из игры престолов', hasEat: true },
      { id: 6, title: 'Біг Тенис', icon: '🎾', desc: 'Хули тут сказать - Біг пеніс', hasEat: true },
      { id: 7, title: 'Хоррор комната', icon: '👻', desc: 'Если обосраться то вместе', hasEat: true },
      { id: 8, title: 'Приют для собачек', icon: '🐶', desc: 'Покормить, погладить, сделать доброе дело', hasEat: true },
      { id: 9, title: 'Стрельбище', icon: '🎯', desc: 'Пострілять с gun и сделать няманяма', hasEat: true },
      { id: 10, title: 'Вкусно покушать, кино и 🔞', icon: '🎬', desc: 'Хм… кабута уже база', hasEat: false, fullWidth: true }
    ];

    let userSelection = { activity: '', food: '' };

    /* 1. КИНЕМАТОГРАФИЧНОЕ 3D-ОТКРЫТИЕ И ПОЛЕТ ВНУТРЬ */
    const scene = document.getElementById('envelope-scene');
    let isOpening = false;

    scene.addEventListener('click', () => {
      if (isOpening) return;
      isOpening = true;

      // Скрываем заголовок и стрелочку
      document.getElementById('intro-title').style.opacity = '0';
      document.getElementById('intro-arrow').style.opacity = '0';

      // 1 фаза: открывается клапан
      scene.classList.add('opening');

      // 2 фаза: камера залетает внутрь кармана
      setTimeout(() => {
        scene.classList.add('zoom-dive');
      }, 600);

      // 3 фаза: переключаем экран
      setTimeout(() => {
        showScreen('screen-grid');
      }, 1450);
    });

    /* 2. РЕНДЕР СЕТКИ */
    const gridContainer = document.getElementById('activities-grid');
    activities.forEach(item => {
      const el = document.createElement('div');
      el.className = `grid-item ${item.fullWidth ? 'full-width' : ''}`;
      el.innerHTML = `<div class="icon">${item.icon}</div><div class="title">${item.title}</div>`;
      el.onclick = () => openFocusModal(item);
      gridContainer.appendChild(el);
    });

    /* 3. МОДАЛКА ЗУМА */
    const modal = document.getElementById('focus-modal');
    function openFocusModal(item) {
      document.getElementById('modal-title').innerText = item.title;
      document.getElementById('modal-desc').innerText = item.desc;
      userSelection.activity = item.title;

      const actions = document.getElementById('modal-actions');
      actions.innerHTML = '';

      if (item.hasEat) {
        const btnEat = document.createElement('button');
        btnEat.className = 'btn btn-primary';
        btnEat.innerText = 'Принимаю, выбрать ✨eat✨';
        btnEat.onclick = () => {
          modal.classList.remove('active');
          showScreen('screen-eat');
        };
        actions.appendChild(btnEat);
      } else {
        const btnAccept = document.createElement('button');
        btnAccept.className = 'btn btn-primary';
        btnAccept.innerText = 'Принимаю ❤️';
        btnAccept.onclick = () => {
          modal.classList.remove('active');
          userSelection.food = 'Без доп. еды';
          confirmDate();
        };
        actions.appendChild(btnAccept);
      }

      const btnCancel = document.createElement('button');
      btnCancel.className = 'btn btn-secondary';
      btnCancel.innerText = 'Хочу выбрать другое';
      btnCancel.onclick = () => modal.classList.remove('active');
      actions.appendChild(btnCancel);

      modal.classList.add('active');
    }

    /* 4. ВЫБОР ЕДЫ */
    function selectFood(card, name) {
      document.querySelectorAll('.food-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      document.getElementById('custom-food').value = '';
      userSelection.food = name;
    }

    document.getElementById('custom-food').addEventListener('input', (e) => {
      if (e.target.value.trim() !== '') {
        document.querySelectorAll('.food-card').forEach(c => c.classList.remove('selected'));
        userSelection.food = e.target.value.trim();
      }
    });

    /* 5. ПОДТВЕРЖДЕНИЕ */
    function confirmDate() {
      const customVal = document.getElementById('custom-food')?.value.trim();
      if (customVal) userSelection.food = customVal;
      if (!userSelection.food) userSelection.food = 'Не выбрано';

      sendToTelegram(userSelection.activity, userSelection.food);

      showScreen('screen-final');
      startFireworks();
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const activeScreen = document.getElementById(id);
      activeScreen.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* САЛЮТЫ */
    function startFireworks() {
      const duration = 4 * 1000;
      const animationEnd = Date.now() + duration;

      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);

        confetti({
          particleCount: 30,
          startVelocity: 30,
          spread: 360,
          origin: { x: Math.random(), y: Math.random() - 0.2 },
          colors: ['#f7a8b8', '#ffccd5', '#ffd166', '#f48498', '#ffffff']
        });
      }, 350);
    }

    /* НАДЕЖНАЯ ОТПРАВКА В TELEGRAM ЧЕРЕЗ POST */
    function sendToTelegram(activity, food) {
      if (!TELEGRAM_BOT_TOKEN || TELEGRAM_BOT_TOKEN === '8671834812:AAHOpM25LDC8o12YCkOIQK780ZWHVoJP0t8') {
        console.warn('Не указан Telegram Bot Token');
        return;
      }

      const text = `💌 <b>Николь ответила на приглашение!</b>\n\n🎯 <b>Свидание:</b> ${activity}\n🍕 <b>Где покушать:</b> ${food}`;

      fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: text,
          parse_mode: 'HTML'
        })
      })
      .then(res => res.json())
      .then(data => {
        if (!data.ok) {
          console.error('Ошибка Telegram API:', data.description);
        }
      })
      .catch(err => console.error('Ошибка отправки:', err));
    }
  </script>
</body>
</html>
